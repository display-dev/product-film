<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>product-film cover</title>
<!-- Rendered to cover.png by dev-scripts/build-cover.mjs. Frames come from the templates' example renders (assets/frames/). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --plate: #F3F3F3; --ink: #121212; --muted: #5d5d5d; --line: rgba(18,18,18,.12); --accent: #0E8A7E; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; background: var(--plate); color: var(--ink); font-family: Geist, system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 430px 1fr; gap: 40px; height: 100%; padding: 56px 56px 56px 64px; align-items: center; }
  h1 { font-size: 68px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  h1 span { color: var(--accent); }
  p { margin-top: 22px; font-size: 24px; line-height: 1.32; color: var(--muted); letter-spacing: -0.01em; }
  .cmd { margin-top: 34px; font: 500 15px/1 "Geist Mono", ui-monospace, monospace; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; }
  .shot { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: 0 18px 40px rgba(30,28,20,.10); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { margin-top: 9px; font: 500 13px/1 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>product<span>-</span>film</h1>
      <p>Short product films from your product's real UI, made by your AI assistant.</p>
      <div class="cmd">npx skills add display-dev/product-film</div>
    </div>
    <div class="grid">
      <figure><div class="shot"><img src="frames/cinematic.jpg" alt=""></div><figcaption>A · B  cinematic</figcaption></figure>
      <figure><div class="shot"><img src="frames/walkthrough.jpg" alt=""></div><figcaption>C  walkthrough</figcaption></figure>
      <figure><div class="shot"><img src="frames/kinetic.jpg" alt=""></div><figcaption>C  kinetic</figcaption></figure>
      <figure><div class="shot"><img src="frames/paper.jpg" alt=""></div><figcaption>D  paper collage</figcaption></figure>
    </div>
  </div>
</body>
</html>
