<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- Reel engine (product-film skill, references/reel-style.md). A launch reel cut to music on two flat plates: one claim
     and the product doing it per section, every section boundary on a bar line. It runs on the walkthrough pipeline:
     plan-R.json ("page": "reel.html", one clip, no dissolves) with render.js, audit.js, plan-jobs.py, assemble.sh, and
     previewq.js with PAGE=reel.html.
     The music grid (BPM, OFFSET) and the section list (bars, plate, entry, kicker, claim) are the first script below.
     Every time on the page derives from them, so a new track re-times the film in one place: run beatmap.py on the
     track and paste its BPM and OFFSET. Times inside a section are in beats (B) and half-beats (H) from its bar line;
     exits (the dive) count back from the section's end, so changing a section's bars adds or removes a hold at its end.
     window.seek(t) draws film time t from scratch. Each section is its own element, shown only during its bars, so
     audit.js reads straight across the hard cuts: it compares an element only on frames where it is visible.
     Example product: Tidewell, a fictional shared-docs app. Replace the sections' content; keep the engine. -->
<script>
// ================= the music grid and the sections: re-time the film here =================
// BPM and OFFSET come from beatmap.py. OFFSET is the film time of the first bar line: 0 when the track is laid from a
// downbeat (beatmap.py prints that start point). Sections start on bar lines, in this order, and last `bars` bars.
//   plate: 'dark' or 'light'. in: 'cut' (default, a hard cut on the bar) or 'wipe' (the plate rises from the bottom in
//   WIPE = 0.1 s and lands on the bar). out: 'dive' (the section's .divew window fills the frame over DIVE = 0.25 s,
//   then the cut).
//   kicker/claim: the section's mono kicker and claim. In a claim, ' | ' breaks the line, {…} takes the accent and
//   […] gets an accent tint. fb: show the "Fictional brands" label.
const BPM = 126, OFFSET = 0;
const SECTIONS = [
  { id: 'range',    bars: 2, plate: 'dark',  fb: true },
  { id: 'reveal',   bars: 2, plate: 'dark' },
  { id: 'default',  bars: 2, plate: 'light', claim: 'Feedback lives in five places.', fb: true },
  { id: 'proof',    bars: 1, plate: 'light', claim: 'Your client opens [one link].', out: 'dive', fb: true },
  { id: 'comment',  bars: 2, plate: 'dark',  kicker: 'tidewell comments', claim: 'Comment on the exact line.', fb: true },
  { id: 'versions', bars: 1, plate: 'light', kicker: 'tidewell versions', claim: 'Every version, same link.', in: 'wipe', fb: true },
  { id: 'verbs',    bars: 1, plate: 'dark',  kicker: 'tidewell share --private', claim: 'Share it your way.' },
  { id: 'setup',    bars: 1, plate: 'light', claim: 'Start in one line.' },   // 2 bars: a held status row and a longer quiet stretch before the hit
  { id: 'end',      bars: 2, plate: 'dark' },
];
</script>

<script>
const B = 60 / BPM, H = B / 2, BAR = 4 * B;   // beat, half-beat, bar (4/4)
const WIPE = .1, DIVE = .25, RISE = .22, CPS = 50;   // plate wipe (starts at most 0.1 s before its bar), dive, line rise (s); burst typing (characters/s)
{ let n = 0; SECTIONS.forEach((s, i) => { s.i = i; s.t0 = OFFSET + n * BAR; n += s.bars; s.t1 = OFFSET + n * BAR; s.dur = s.t1 - s.t0; }); }
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const END = SECTIONS[SECTIONS.length - 1].t1;

HTML.setup = `<div class="scard" id="scd"><div class="lab">IN YOUR TERMINAL</div><div class="fld"><span class="pr">$</span><span id="scmd"></span><span class="car" id="scar"></span></div><div class="cpy" id="scpy">Copy command</div></div>
  <div class="srow" id="srw"><span class="dot" id="sdot"></span><b>Waiting for your first page</b><span>· Northfield Studio</span><span class="tg">CONNECTED</span></div>
  <div class="mc" id="smc">${ARROW}</div>`;
HTML.end = `<div class="ewm" id="ewm">Tidewell<span class="car" id="ewc"></span></div>
  <div class="etg">${lines('shared docs for client work, | without the email chain')}</div>
  <div class="ehr" id="ehr"></div>
  <div class="efl">${FEATURES.map((f, i) => `<span id="ef${i}">${i ? '  •  ' : ''}${f}</span>`).join('')}</div>
  <div class="eurl" id="eurl">tidewell.example</div>`;
$('stage').innerHTML = SECTIONS.map(s => `<div class="sec ${s.plate}" id="sec-${s.id}">${HTML[s.id] || ''}${s.claim ? `<div class="cl">${s.kicker ? `<div class="kick" id="k-${s.id}">${s.kicker}</div>` : ''}<div class="ct">${lines(s.claim)}</div></div>` : ''}${s.fb ? '<div class="fb">Fictional brands</div>' : ''}</div>`).join('');
SECTIONS.forEach(s => { s.el = $('sec-' + s.id); s.lis = [...s.el.querySelectorAll('.cl .li')]; });

// ================= sections: timelines. T is seconds from the section's bar line; B a beat, H a half-beat =================
const FN = {};
// range: one row of the wall per beat; on bar 2 a veil and the claim types in, its second line a beat later
FN.range = (T, s) => {
  DOCS.forEach((d, i) => { const t0 = Math.floor(i / WALL_COLS) * B + (i % WALL_COLS) * .035, u = eo(seg(T, t0, t0 + .22));
    put($('th' + i), { y: lerp(54, 0, u), s: lerp(.92, 1, u), op: seg(T, t0, t0 + .1) }); });
  $('wall').style.transform = `scale(${lerp(1, 1.025, seg(T, 0, s.dur)).toFixed(4)})`;   // a slow push-in
  const V = BAR, L2 = V + B; $('veil').style.opacity = eo(seg(T, V, V + .18)).toFixed(3);
  type($('rg1'), RANGE_CLAIM[0], T, V); type($('rg2'), RANGE_CLAIM[1], T, L2);
  caret($('rgc1'), s.t0 + T, T < V + RANGE_CLAIM[0].length / CPS, T >= V && T < L2);
  caret($('rgc2'), s.t0 + T, T < L2 + RANGE_CLAIM[1].length / CPS, T >= L2);
};
// reveal (the drop): the wordmark focus-pulls in; the feature line arrives a word per half-beat; on bar 2 the wordmark
// shrinks to a header and the tagline rises a line per half-beat
FN.reveal = (T, s) => {
  const wm = $('rvwm'), fu = eo(seg(T, 0, .15)), sh = eio(seg(T, BAR, BAR + .16));
  wm.style.transform = `translate(${f2(lerp(0, 4, sh))}px,${f2(lerp(0, 84 - 300, sh))}px) scale(${(lerp(1, 34 / 232, sh) * lerp(1.05, 1, fu)).toFixed(4)})`;
  wm.style.filter = fu < 1 ? `blur(${f2(20 * (1 - fu))}px)` : ''; wm.style.opacity = lerp(.35, 1, fu).toFixed(3);
  caret($('rvc'), s.t0 + T, false);
  FEATURES.forEach((f, i) => { const ti = (2 + i) * H, e = $('rvf' + i); e.style.visibility = T >= ti ? 'visible' : 'hidden';
    e.style.color = T >= ti && (i === FEATURES.length - 1 || T < ti + H) ? 'var(--acc)' : ''; });   // the newest word takes the accent
  sink($('rvfl'), T, BAR);
  rise([...$('rvtag').querySelectorAll('.li')], T, BAR + .12);   // starts once the shrinking wordmark has cleared line 1
  rise([...s.el.querySelectorAll('.rvsub .li')], T, BAR + 6 * H);
};
// the default: three copies of the same feedback land in a pile on beats 1–3, spread into a row on bar 2, and are
// red-penned one per half-beat
const PILE = [[-40, 26, -6], [34, -14, 4], [-4, 34, -2]], PILEX = 710, PILEY = 410, ROWX = [150, 710, 1270], ROWY = 444;
FN.default = (T) => {
  const us = eio(seg(T, BAR, BAR + .32));
  for (let i = 0; i < 3; i++) { const ta = (1 + i) * B, ua = eo(seg(T, ta, ta + .3)), el = $('dk' + i);
    el.style.visibility = T >= ta ? 'visible' : 'hidden';
    put(el, { x: lerp(PILEX + PILE[i][0], ROWX[i], us), y: lerp(lerp(1150, PILEY + PILE[i][1], ua), ROWY, us), r: lerp(lerp(PILE[i][2] * 2.5, PILE[i][2], ua), 0, us) });
    const tr = BAR + (1 + i) * H, ur = eio(seg(T, tr, tr + .2)), rp = $('rp' + i); rp.style.strokeDashoffset = (1 - ur).toFixed(4); rp.style.opacity = ur > 0 ? 1 : 0;
    pop($('mk' + i), T, tr + .1, { r: -4, s0: .5 }); }
};
// proof: the claim's key words get the tint; the page slides up in a browser window and scrolls; then the dive
FN.proof = (T, s) => {
  s.el.querySelector('.tint').style.setProperty('--w', eio(seg(T, 2 * H, 2 * H + .2)).toFixed(4));
  put($('pfw'), { y: lerp(860, 0, eo(seg(T, H, H + .36))) });
  $('pfs').style.transform = `translateY(${f2(-330 * eio(seg(T, 3 * H, s.dur - DIVE - .04)))}px)`;
};
// comment: a selection drags across the headline, the client's comment lands on the bar, the reply a beat later
FN.comment = (T, s) => {
  put($('cmw'), { y: lerp(90, 0, eo(seg(T, 0, .34))), s: lerp(1, 1.025, seg(T, .34, s.dur)) });
  $('cmhl').style.setProperty('--w', eio(seg(T, 4 * H, 6 * H)).toFixed(4));
  pop($('cm1'), T, 8 * H, { s0: .85 }); pop($('cm2'), T, 10 * H, { s0: .85 });
  $('cmn').textContent = T >= 10 * H ? '2' : T >= 8 * H ? '1' : '0';
};
// versions: v1 → v2 → v3 on half-beats; the page changes with the chip, the history grows, the link stays
FN.versions = (T) => {
  const VT = [-Infinity, 2 * H, 4 * H]; let v = 0; VT.forEach((x, i) => { if (T >= x) v = i; });
  const ch = $('vchip'); ch.textContent = `v${v + 1}`; ch.style.transform = v ? `scale(${lerp(1.5, 1, bo(seg(T, VT[v], VT[v] + .3))).toFixed(3)})` : '';
  ch.style.color = v ? 'var(--accent)' : ''; ch.style.borderColor = v ? 'color-mix(in oklab, var(--accent) 45%, transparent)' : '';
  $('vh1').textContent = VERS[v].h1; $('vpc').textContent = VERS[v].pieces;
  VERS.forEach((_, i) => { const el = $('hr' + i); let y = 54; for (let j = i + 1; j < VERS.length; j++) y += 98 * eio(seg(T, VT[j], VT[j] + .18));
    const pu = i ? eo(seg(T, VT[i], VT[i] + .2)) : 1; el.style.visibility = T >= VT[i] ? 'visible' : 'hidden';
    put(el, { y: y + lerp(-24, 0, pu), op: pu }); el.style.borderColor = i === v ? 'color-mix(in oklab, var(--accent) 55%, transparent)' : ''; });
};
// verbs: a word per half-beat; the newest takes the accent and the earlier ones settle ("expire" settles dim);
// the last gets the dashed box and a sparkle. The kicker follows the newest word.
FN.verbs = (T) => {
  let cur = 0; VERBS.forEach(([, flag], i) => { const ti = (1 + i) * H, e = $('vw' + i); if (T >= ti) cur = i;
    pop(e, T, ti, { s0: .55 }); e.style.color = i === VERBS.length - 1 ? 'var(--acc)' : inkMix('var(--acc)', i === 4 ? 'var(--dim)' : 'var(--fg)', seg(T, ti + H, ti + H + .14)); });
  $('k-verbs').textContent = `tidewell share ${VERBS[cur][1]}`;
  const tb = VERBS.length * H + .04; $('vdb').style.clipPath = `inset(0 ${f2(100 - 100 * eio(seg(T, tb, tb + .2)))}% 0 0)`;
  pop($('vsp'), T, tb + .14, { s0: .2, r: lerp(-50, 0, eo(seg(T, tb + .14, tb + .5))) });
};
// setup: burst-types the command, the pointer clicks Copy on a half-beat, the status row rises on the next beat
FN.setup = (T, s) => {
  put($('scd'), { y: lerp(50, 0, eo(seg(T, 0, .3))) });
  type($('scmd'), CMD, T, H); caret($('scar'), s.t0 + T, T < H + CMD.length / CPS, T >= H * .5);
  const btn = $('scpy'), P = 3 * H;
  btn.textContent = T >= P + .08 ? 'Copied ✓' : 'Copy command'; btn.classList.toggle('hov', T >= P - .1 && T < P + .08);
  btn.style.transform = `scale(${(1 - .05 * press(T, P)).toFixed(3)})`;
  const bx = 106 + btn.offsetLeft + btn.offsetWidth / 2, by = 262 + btn.offsetTop + btn.offsetHeight / 2;   // layout offsets ignore transforms
  // arrive, press, drift off and leave a beat later: timed from the click, so a longer section never parks the pointer
  cursor($('smc'), T, [{ t: .34, x: bx + 260, y: by + 170 }, { t: P - .04, x: bx + 4, y: by + 6 }, { t: P + .3, x: bx + 7, y: by + 8 }, { t: P + 1.3, x: bx + 40, y: by + 30 }], [P], [.34, P + 1]);
  const ur = eo(seg(T, 4 * H, 4 * H + .26)); put($('srw'), { y: lerp(26, 0, ur), op: ur.toFixed(3) });
  $('sdot').style.transform = `scale(${(1 + .4 * (1 - seg((((s.t0 + T - OFFSET) / B) % 1 + 1) % 1, 0, .45))).toFixed(3)})`;   // pulses on the beat
};
// end card (the hit): the wordmark focus-pulls in; tagline lines, the hairline, the feature line and the URL follow on half-beats
FN.end = (T, s) => {
  const fu = eo(seg(T, 0, .15)), wm = $('ewm'); wm.style.filter = fu < 1 ? `blur(${f2(18 * (1 - fu))}px)` : '';
  wm.style.transform = `scale(${lerp(1.04, 1, fu).toFixed(4)})`; wm.style.opacity = lerp(.35, 1, fu).toFixed(3);
  caret($('ewc'), s.t0 + T, false);
  rise([...s.el.querySelectorAll('.etg .li')], T, H);
  $('ehr').style.transform = `scaleX(${eio(seg(T, 3 * H, 3 * H + .36)).toFixed(4)})`;
  FEATURES.forEach((f, i) => { $('ef' + i).style.visibility = T >= (4 + i) * H ? 'visible' : 'hidden'; });
  pop($('eurl'), T, 8 * H, { s0: .8 });
};

// ================= engine: transitions and seek =================
// dive: the section's .divew window scales about its center until it covers the frame, then the bar cuts
function dive(s, T) { const w = s.el.querySelector('.divew'), win = w.firstElementChild, u = eio(seg(T, s.dur - DIVE, s.dur));
  if (u <= 0) { w.style.transform = ''; win.style.borderRadius = ''; return; }
  const cx = win.offsetLeft + win.offsetWidth / 2, cy = win.offsetTop + win.offsetHeight / 2, sc = lerp(1, Math.max(1920 / win.offsetWidth, 1080 / win.offsetHeight), u);
  w.style.transformOrigin = `${f2(cx)}px ${f2(cy)}px`; w.style.transform = `translate(${f2((960 - cx) * u)}px,${f2((540 - cy) * u)}px) scale(${sc.toFixed(4)})`;
  win.style.borderRadius = `${f2(14 * (1 - u) / sc)}px`; }
window.seek = function (t0) { const t = TOFF + t0;
  for (const s of SECTIONS) {
    const a = s.i === 0 ? -Infinity : s.t0 - (s.in === 'wipe' ? WIPE : 0), b = s.i === SECTIONS.length - 1 ? Infinity : s.t1;
    const on = t >= a && t < b; s.el.style.display = on ? 'block' : 'none'; if (!on) continue;
    const T = t - s.t0;
    s.el.style.transform = s.in === 'wipe' && T < 0 ? `translateY(${f2(1080 * (1 - eo(seg(T, -WIPE, 0))))}px)` : '';   // a later section sits above the earlier one
    rise(s.lis, T, 0);
    FN[s.id] && FN[s.id](T, s);
    if (s.out === 'dive') dive(s, T);
  } };
// every face the page uses, loaded before the first frame (a face used only by a hidden section would otherwise load late)
window.READY = Promise.all(['400', '500', '600', '700'].map(w => `${w} 20px Geist`).concat(['500 20px "Geist Mono"', '600 20px "Geist Mono"', '400 20px "Caveat Brush"', '400 20px Anton', '400 20px "Instrument Serif"', 'italic 400 20px "Instrument Serif"'])
  .map(f => document.fonts.load(f, 'Aa1–•·→').catch(() => {}))).then(() => window.seek(0));
window.seek(0);
</script></body></html>
